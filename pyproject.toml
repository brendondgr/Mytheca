[project]
name = "velora"
version = "0.0.0"
description = "Velora — an AI-driven interactive narrative engine (FastAPI backend)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

# The backend package lives in web/backend (package name: `app`).
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["utils/tests"]
pythonpath = ["web/backend"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
mypy_path = "web/backend"
ignore_missing_imports = true
