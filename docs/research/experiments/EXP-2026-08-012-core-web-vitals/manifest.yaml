id: EXP-2026-08-012
slug: core-web-vitals
title: "Core Web Vitals on the first production bundle this repository has ever built"
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  The first measurement of CLS, INP and LCP for Mytheca, on a real `next build` bundle
  under 4x CPU throttling. It was previously impossible: `next/font/google` fetched at
  build time, so the build hard-failed offline and there was no bundle to profile. This
  closes the single outright FAIL in `docs/plans/frontend-polish-acceptance.md` against
  the polish spec's section 14, and the "Core Web Vitals have never been measured"
  entry in `docs/checklist.md`.

hypothesis: >
  Pre-registered in PROTOCOL.md. H1 - both routes score CLS below 0.1, because the causes
  of layout shift were addressed structurally and the self-hosted fonts carry
  metric-compatible fallbacks. H2 - the Library's LCP is under 2.5s. H3 - INP is the
  weakest of the three, and if anything misses its threshold it is INP on the story
  player, which is the interaction surface and streams.

