id: EXP-2026-08-007
slug: prose-form
title: In-voice frequency/presence penalties destroy sentence structure in character prose
status: complete
date_started: 2026-08-21
date_completed: '2026-08-21'
authors:
- brendondgr
purpose: 'The character passage form ships and does not read like a scene: run-ons with no punctuation,
  no spoken dialogue, one unbroken block. This asks whether the in-voice sampler penalties applied by
  character_turn_agent._voice_params are the cause, so the fix can be set from a measurement rather than
  a prior.

  '
hypothesis: 'The penalties are the cause. They fall on every token, and the tokens prose is made of are
  its most repeated ones (the full stop, the comma, the double quote, "I", "the"), so penalising them
  should show up as few sentence terminators per hundred words, no quotation marks and no paragraph breaks.
  Predicted direction: removing them increases all three.

  '
