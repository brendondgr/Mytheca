id: EXP-2026-08-008
slug: prose-end-to-end
title: The prose form end to end — does a live turn read like a scene, and at what cost in discarded beats?
status: complete
date_started: 2026-08-21
date_completed: 2026-08-21
authors:
- brendondgr
purpose: 'EXP-2026-08-007 measured the sampler by calling the relay directly, with the shipped character
  contract as the only system message — isolating the sampler and leaving out the planner, the assembled
  context, the emission parser and the four guards that can discard a passage. This asks the question
  the owner actually asks: does the prose read like a scene when it comes out of the real turn engine,
  over a real multi-turn session, and without paying for it in beats the guards had to throw away? It
  is the verification phase of docs/plans/prose-that-reads-like-a-scene.md.

  '
hypothesis: 'Stated before the run. Yes, and without paying for it in discarded beats: every character
  beat carries quoted speech and a paragraph break, no beat duplicates another in the session, sentences_per_100_words
  lands in the range EXP-2026-08-007''s `off` arm produced (11.42 +/- 3.96), and discards stay in single
  figures. The structural fixes are prompt-independent and the sampler finding removed what broke the
  form.

  '
