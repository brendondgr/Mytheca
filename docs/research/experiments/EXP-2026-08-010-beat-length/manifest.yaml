id: EXP-2026-08-010
slug: beat-length
title: Short/Medium/Long beat length — a paragraph count binds where a word count did not
status: complete
date_started: 2026-08-21
date_completed: 2026-08-21
authors:
- brendondgr
purpose: >
  `beat_length` is a new per-scenario control over how much a character says in one beat
  (short 1-2 paragraphs, medium 2-4, long 5-6), implemented as a paragraph count in the
  character prompt's recency TAIL with a per-tier token allowance behind it. This asks
  whether the three tiers actually separate, and whether the control costs anything in the
  prose form EXP-2026-08-009 showed was working. It matters beyond the feature because a
  countable length target has already failed on this codebase (EXP-2026-08-007: a
  "usually 80-200 words" instruction moved the average UP).
hypothesis: >
  Stated before the run, outcome genuinely unknown. Paragraphs per beat separates in order
  short < medium < long, with short at or below 2 and long at or above 5; chars follows the
  same ordering; no form metric regresses at any tier; discards stay in single figures. The
  bet is that a paragraph count binds where a word count did not, because it names an axis
  the model already controls deliberately.
