purpose: 'Feasibility check for the narrative-style-instructions feature. Does attaching a storyline-level
  style guide to the CACHED SYSTEM PREFIX (between the character output contract and the world primer
  — the placement chosen for prefix-cache reuse) actually change the prose a character beat comes back
  with, in the direction the guide asks for, on the local model? If it does not, the guide has to ride
  in the volatile recency tail instead, which is the design''s main open trade-off.

  '
hypothesis: 'Pre-registered. The romance guide asks for proximity and physical specifics, for interiority,
  and forbids naming a feeling that could be shown. So proximity_per_1k (primary) and interiority_per_1k
  are HIGHER in the romance arm, named_emotion_per_1k is LOWER, and dialogue_share is roughly unchanged.
  n is 12 calls: a feasibility check, not a powered comparison. No significance test is run and none is
  claimed.

  '
