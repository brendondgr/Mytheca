id: EXP-2026-08-011
slug: context-compaction
title: Does compacting dropped history preserve continuity, and what does it cost?
status: complete
date_started: 2026-08-22
date_completed: '2026-08-22'
authors:
- brendondgr
purpose: 'When a scene outgrows the model''s context window the oldest beats are dropped, which is how
  a scene forgets that someone already confessed or already left. `services/history_compaction` folds
  those beats into a rolling summary instead. This asks whether that preserves continuity the control
  loses, what it costs in calls and prompt-cache reuse, and — the question that would stop the ship —
  whether it makes the writing worse. It is the evidence gating whether TURN_CONTEXT_COMPACTION may ever
  default to true; it currently ships off.

  '
hypothesis: 'H1 continuity — with compaction on, a late-scene line referring to a fact established before
  the verbatim window is answered consistently more often than with it off. H2 cost — at most one model
  call per anchor block, and no material loss of reusable prompt prefix, because the summary sits at the
  head of the append-only region and so changes on the same turns the anchored window re-anchors. H3 writing
  — compaction does not make the prose worse; this is the null we most want to be unable to reject, and
  a blinded read preferring the control is the honest reason to leave the flag off. Full statement in
  PROTOCOL.md, written before the run.

  '
