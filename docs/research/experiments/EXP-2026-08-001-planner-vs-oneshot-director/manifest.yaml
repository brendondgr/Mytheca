title: ReAct per-beat planner vs. the one-shot speaker-set director
status: planned
date_started: 2026-08-06
date_completed: null
authors:
- brendondgr
purpose: 'Does the shipped ReAct per-beat planner produce different multi-party turn structure than the
  one-shot speaker-set director it replaced? Tests claim C-005. Both arms already exist in the repository
  and are already tested, so this is the cheapest genuine experiment available; the baseline is the design
  that actually shipped first, not a strawman written for the occasion.

  '
hypothesis: 'The per-beat planner produces more beats and more distinct speakers per turn than the one-shot
  director, which commits to a speaker set up front and is capped at three. No difference is predicted
  on addressed-character response rate, since both arms short-circuit a directed address.

  '
