id: EXP-2026-08-002
slug: moment-prompt-style
title: Do in-narrative moment prompts describe the cast by appearance rather than by name?
status: complete
date_started: 2026-08-11
date_completed: 2026-08-11
authors: [Claude Opus 5 (agent), brendondgr]
purpose: >
  Verification of the in-narrative image feature's central design claim: an image model
  cannot resolve a character name, so a prompt that says "Maerin closes her ledger" paints
  a stranger. The pipeline therefore instructs the prompt writer to describe every figure
  by appearance and action, and enforces it afterwards with a deterministic guard
  (`moment_agent.strip_names`). This run measures whether the shipped pipeline actually
  produces name-free, appearance-grounded, landscape prompts against the real LLM and the
  real ComfyUI server. It supports no paper claim yet — it is a feature-verification run,
  recorded because the contract records evaluation runs, not only publishable ones.
hypothesis: >
  Every run emits a positive prompt containing no cast name in any form (name_leak = 0),
  covering every in-frame character with at least one token from their own authored
  appearance (appearance_coverage = 1.0), and renders a landscape frame (landscape = 1.0).
