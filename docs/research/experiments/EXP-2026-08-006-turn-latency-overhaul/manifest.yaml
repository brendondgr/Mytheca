# Experiment manifest — the machine-readable record.

id: EXP-2026-08-006
slug: turn-latency-overhaul
title: Turn latency after the overhaul — the prompt cache is reclaimed; wall-clock is not measurable on this endpoint
status: complete
date_started: 2026-08-20
date_completed: 2026-08-20
authors: [brendondgr]

purpose: >
  Five changes were made to the turn loop on the strength of EXP-2026-08-005's cost
  breakdown (bounded decision timeouts, removal of the continuity guard, multi-beat
  planning, a cache-shaped prompt behind a block-anchored transcript window, and live
  reasoning on by default). This measures what they actually did, against the same
  endpoint and the same scene configuration one day later. It supports C-009's successor
  reading: the wasted prefix cache is now reclaimed. It also establishes, as an unplanned
  finding, that this endpoint's throughput varies by 66x on identical work — which makes
  every cross-run wall-clock comparison in this experiment, and the causal reading of
  EXP-2026-08-005's stalls, unusable.

hypothesis: >
  H1 the planner's share falls below 25% and its call count falls ~3x; H2 the continuity
  guard's 11% is gone; H3 the reusable prompt prefix exceeds 60% from turn 3 and does not
  decay; H4 no turn reaches the generation timeout; H5 live reasoning reaches the player
  far ahead of prose. Stated in PROTOCOL.md before the run, with a falsification list.

