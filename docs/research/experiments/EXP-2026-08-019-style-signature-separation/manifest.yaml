id: EXP-2026-08-019
slug: style-signature-separation
title: Separating the tail Signature from the cached-prefix style guide (three arms, local model)
status: complete
date_started: 2026-08-29
date_completed: 2026-08-29
authors:
- brendondgr
- claude
purpose: 'EXP-2026-08-018''s style arm carried the four prose blocks in the cached system prefix AND the
  one-clause signature in the volatile recency tail, so it could not say which changed the prose. It recorded
  the separation as owed; this is it. The decision it feeds: the signature is the only block re-read on
  every beat, so if the cached prefix carries the effect the field is a per-beat cost buying nothing and
  should leave the contract.

  '
hypothesis: 'Pre-registered, three outcomes. (a) The prefix carries it: prefix ~= prefix_signature, both
  above baseline, and the field comes out. (b) The signature carries it: prefix ~= baseline and prefix_signature
  above both, which would mean the cached-prefix placement is insufficient and the design''s central trade-off
  was called wrong. (c) Both contribute: baseline < prefix < prefix_signature, and the field stays. Primary
  metric is proximity_per_1k, unchanged from EXP-2026-08-018 so the two are comparable. n is 18 calls;
  no significance test is run and none is claimed.

  '
