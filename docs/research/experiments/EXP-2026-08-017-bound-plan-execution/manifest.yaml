id: EXP-2026-08-017
slug: bound-plan-execution
title: Bound upfront plan — two execution arms (continuous vs per-beat) over one plan
status: complete
date_started: 2026-08-26
date_completed: 2026-08-26
authors:
- brendondgr
purpose: 'The turn loop now plans once per turn and executes that plan instead of re-planning
  after every beat. This asks two things: whether a plan is actually binding (beats run ==
  beats planned, one planning call), and which of two execution strategies over that plan is
  better — one continuous generation with speaker hand-offs, or one generation per planned
  beat. The binding property was NOT met, so per PROTOCOL section 6 no arm comparison is
  reported and the execution question stays open.

  '
hypothesis: 'Plan adherence is 1.0 in both arms with exactly one planner call per turn;
  continuous is faster per beat; voiced reuses more prefix cache; voice distinctness does not
  differ materially. Adherence and speed were refuted; cache reuse was supported.

  '
