id: EXP-2026-09-002
slug: character-memory-callback-rerun
title: Does episodic recall cause verbatim callbacks? Directional, not separable at n=2
status: complete           # planned | running | complete | failed | superseded
date_started: 2026-09-01
date_completed: 2026-09-01
authors: [brendondgr, Claude Opus 5]

purpose: >
  Whether episodic recall (docs/plans/character-memory-graph.md) causes characters to reuse
  specific prior material in later turns, measured as a verbatim callback rate against a
  recall-off baseline. Answer: the recall-on arm is directionally higher on both thresholds,
  but the per-run ranges overlap — exactly, at 0.125 on the primary — so no effect is
  established at two runs per arm. Supersedes EXP-2026-09-001, which failed on a confound.

hypothesis: >
  Recall raises the verbatim callback rate above the recall-off baseline. Directionally
  consistent with the data; not established by it.

