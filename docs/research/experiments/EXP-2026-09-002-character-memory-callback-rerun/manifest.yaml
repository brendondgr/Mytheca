  # requires it for n>1; RESULTS.md says what it is and is not.
  values:
    verbatim_callback_rate_off: {mean: 0.1079, std: 0.0171, n: 2}
    verbatim_callback_rate_loose_off: {mean: 0.1079, std: 0.0171, n: 2}
    recall_fire_rate_off: {mean: 0.0, std: 0.0, n: 2}
    memories_per_turn_off: {mean: 2.375, std: 0.625, n: 2}
    verbatim_callback_rate_on: {mean: 0.1875, std: 0.0625, n: 2}
    verbatim_callback_rate_loose_on: {mean: 0.3125, std: 0.1875, n: 2}
    recall_fire_rate_on: {mean: 1.0, std: 0.0, n: 2}
    cue_share_on: {mean: 1.0, std: 0.0, n: 2}
    quote_offer_share_on: {mean: 0.5923, std: 0.2077, n: 2}
