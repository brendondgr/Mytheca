id: EXP-2026-08-016
slug: continuous-scene-script
title: Continuous scene script vs per-speaker calls — ABANDONED; only beat counts recovered
status: failed             # planned | running | complete | failed | superseded
# Ran 2026-08-24 and was never written up. Reconstructed 2026-08-31 from the event log,
# recovered from the dev DB before its storyline was deleted. `failed` follows EXP-017's
# reading — the run could not produce the data the protocol asked for, because the arm
# cost instrumentation and all three primary metrics were never captured. Beat counts
# survived exactly, and the arms are identifiable from ISSUES.md. Revising this status is
# the owner's call; see RESULTS.md §0 and ISSUES.md.
date_started: 2026-08-25   # blocked 08-24/25 first; see ISSUES.md
date_completed: 2026-08-25  # the run; the write-up is dated 2026-08-31
authors: [brendondgr]

purpose: >
  Whether one generation writing a whole planned turn with <speaker:N> hand-offs beats
  one call per speaker on attribution and voice distinctness. That question is NOT
  answered — see RESULTS.md. What the surviving log does show is how long turns ran
  under the per-beat planner, which is the observation the bound plan was built on.

hypothesis: >
  Continuous scene script lowers misattribution_rate against per-speaker calls without
  regressing voice_distinctness. UNTESTED — the recovered log carries no arm labels.

