id: EXP-2026-08-014
slug: record-controls
title: Record controls — what a rewind forgets, and what a re-roll sees
status: complete
date_started: 2026-08-22
date_completed: '2026-08-22'
authors:
- brendondgr
purpose: 'Do the five record operations (re-roll, re-run turn, branch, rewind, edit) change everything
  the transcript is derived from, or only the rows? Supports claim C-014.

  '
hypothesis: 'Five, each a specific failure the run can observe: H1 a rewind leaves per-character interior
  state; H2 it leaves the direction the cut turns raised; H3 a re-roll''s context contains the beat it
  replaces; H4 a character beat with no dialogue carries the internal_thought''s event id in the frontend;
  H5 a branch does not inherit the parent''s outstanding direction. Stated in PROTOCOL.md before the baseline
  arm ran.

  '
