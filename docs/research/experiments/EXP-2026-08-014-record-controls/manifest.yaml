  nondeterminism_note: 'The schema wants one number per field; the engine does not have one. 0.7 is `schemas/settings.LlmParams.temperature`,
    the default every agent call inherits. 0.92 is the `neutral` row of `character_turn_agent._REGISTER_SAMPLER`,
    which is the top_p a character beat uses at that register — light/tense/grave run 0.95/0.88/0.85 and
    a speaker''s `looseness` moves it by up to 0.03 a notch, so no single value is true of the whole run.
    Recorded as the modal value rather than left blank.


    Provider-side nondeterminism throughout, and the two arms are DIFFERENT scenes. Every conclusion rests
    on counts of Redis keys, JSON rows and event ids, which nondeterminism cannot move. The two model-dependent
    numbers (recall_coverage*, reroll self_overlap) are reported per arm and never averaged across arms;
    self_overlap is explicitly stated NOT to be evidence. n = 1 scene per probe per arm.

    '
