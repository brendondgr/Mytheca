id: EXP-2026-09-001
slug: character-memory-callback
title: Does episodic recall cause verbatim callbacks? (INVALID — arms ran different code)
status: failed             # planned | running | complete | failed | superseded
date_started: 2026-09-01
date_completed: 2026-09-01
authors: [brendondgr, Claude Opus 5]

purpose: >
  Whether episodic recall (docs/plans/character-memory-graph.md) causes characters to
  reuse specific prior material in later turns, measured as a verbatim callback rate
  against a recall-off baseline. FAILED: the two arms are separate backend processes and
  were started from different working-tree states, so they differ by the treatment AND by
  a phase of the feature. See ISSUES.md. Superseded by EXP-2026-09-002.

hypothesis: >
  Recall raises the verbatim callback rate above the recall-off baseline. Not tested:
  the run is invalid as a comparison.

