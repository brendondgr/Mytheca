id: EXP-2026-08-013
slug: art-style-presets
title: Three art styles emit the LoRA state and tag set they intend, on every image surface
status: complete          # planned | running | complete | failed | superseded
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  Does the three-style art pipeline actually emit three different looks, and does the
  ComfyUI graph it queues carry the LoRA state and tag set the chosen style intends, on
  every image surface? Supports the implementation claim that selecting a style changes
  what is rendered rather than only what the UI says.

hypothesis: >
  Exploratory on the visual half — no prior hypothesis about how different the three looks
  would be. Falsifiable on the mechanical half: every (style x surface) condition should
  carry exactly its own LoRA state and complete tag set, with none of the other styles'
  tags. NOT pre-registered — see ISSUES.md.

