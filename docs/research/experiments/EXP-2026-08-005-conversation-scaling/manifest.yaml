id: EXP-2026-08-005
slug: conversation-scaling
title: Where a conversation's latency goes, and why the prompt cache stops helping
status: complete
date_started: 2026-08-20
date_completed: '2026-08-19'
authors:
- brendondgr
purpose: A single-generation measurement (EXP-2026-08-003/004) cannot explain the reported symptom that
  a scene gets slower as it goes. This drives a real 10-turn conversation at maxTurns=5, suggestionsCount=0,
  contextBeats=100, times every step of every turn, and asks whether the prompt is laid out so the server
  can reuse the conversation between turns.
hypothesis: (1) Per-turn total grows across ten turns. (2) The growth is in the character calls, not the
  pre-generation steps. (3) The prompt cache is largely wasted because the volatile block sits ahead of
  the transcript in the user message. Full statements and falsification conditions in PROTOCOL.md.
