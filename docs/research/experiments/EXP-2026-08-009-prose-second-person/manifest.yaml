id: EXP-2026-08-009
slug: prose-second-person
title: Second person instead of a label — does relabelling the player's line stop characters calling them
  "the player"?
status: complete
date_started: 2026-08-21
date_completed: 2026-08-21
authors:
- brendondgr
purpose: 'EXP-2026-08-008 found that 13 of 18 character beats and 6 of 10 narration beats called the person
  in the room "the player". The cause was the prompt: both transcript builders labelled the human''s line
  `Player:`, the only name either prompt gave to someone present in the scene. This measures whether relabelling
  it `You:` and asking both prompts for the second person stops the leak WITHOUT costing the prose form
  EXP-2026-08-008 showed was working — a fix that removes the leak by making the passages worse is not
  a fix.

  '
hypothesis: 'Stated before the run. names_the_player falls from 0.72 +/- 0.45 to <= 0.10 over character
  beats and narration falls from 6/10 toward zero, while has_speech stays at 1.0, paragraph_breaks stays
  at or above 2.28, is_distinct stays at 1.0, is_scratchpad and starts_mid_sentence stay at 0.0, and discards
  stay in single figures. The label was the mechanism, so removing it removes the supply.

  '
