# Alembic configuration for Velora.
# The database URL is NOT stored here — it is supplied at runtime by env.py
# from app.core.config.get_settings().database_url (or the DATABASE_URL env var).

[alembic]
# Path to the migration environment. %(here)s resolves to this ini file's
# directory, so the CLI works regardless of the CWD it is invoked from.
script_location = %(here)s/alembic

# Template for new revision file names.
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d%%(second)02d_%%(slug)s

# Truncate the revision message used in the filename.
truncate_slug_length = 40

# env.py also inserts web/backend onto sys.path; %(here)s keeps the CLI working
# from any CWD (the ini lives in web/backend).
prepend_sys_path = %(here)s

# Separator for sys.path entries (avoids deprecation warning in Alembic 1.14+).
path_separator = os

# Encode the output of alembic in UTF-8.
output_encoding = utf-8

# sqlalchemy.url is intentionally left blank — env.py sets it dynamically.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
